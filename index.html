<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List - Refatorando</title>
    <link rel="icon"
        href="https://cache.refatorando.com/wp-content/uploads/2023/05/Favicon_Refatorando-1-100x100.png"
        type="image/x-icon">
    <link rel="stylesheet" href="public/css/styles.css">
    <script src="public/js/script.js" defer></script>
</head>
<body class="darkmode">
    <main class="container">
        <header class="header">
            <h1>To-do List</h1>
            <button type="button" class="darkmode-toggle" aria-label="Alternar tema claro e escuro"></button>
        </header>

        <form class="new-todo">
            <label for="new-todo-input" class="sr-only">Nova tarefa</label>
            <input type="text" id="new-todo-input" placeholder="Insira a tarefa aqui e aperte Enter..." autocomplete="off">
        </form>

        <ul class="todo-list">
            <li class="item">
                <input type="checkbox" id="todo-1">
                <label for="todo-1">Ler 10 páginas de um livro</label>
                <button type="button" class="delete" aria-label="Excluir tarefa">×</button>
            </li>
            <li class="item">
                <input type="checkbox" id="todo-2" checked>
                <label for="todo-2">Meditar</label>
                <button type="button" class="delete" aria-label="Excluir tarefa">×</button>
            </li>
            <li class="item">
                <input type="checkbox" id="todo-3">
                <label for="todo-3">Editar dois vídeos</label>
                <button type="button" class="delete" aria-label="Excluir tarefa">×</button>
            </li>
            <li class="item">
                <input type="checkbox" id="todo-4">
                <label for="todo-4">Criar portfólio</label>
                <button type="button" class="delete" aria-label="Excluir tarefa">×</button>
            </li>
            <li class="item">
                <input type="checkbox" id="todo-5">
                <label for="todo-5">Academia</label>
                <button type="button" class="delete" aria-label="Excluir tarefa">×</button>
            </li>
        </ul>

        <footer class="footer">
            <span class="count">4 itens restantes</span>
            <nav class="filter" aria-label="Filtrar tarefas">
                <a href="#todos" class="active">Todos</a>
                <a href="#ativos">Ativos</a>
                <a href="#concluidos">Concluídos</a>
            </nav>
            <button type="button" class="clear-completed">Limpar concluídos</button>
        </footer>
    </main>
</body>
</html>
